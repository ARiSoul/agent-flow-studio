# Template: run the tests and diagnose failures. Only the test runner runs a command
# (workspace.bash, which follows the autonomy); nobody edits files.
version: 1
name: test-runner
title: Run the tests and diagnose failures
description: |
  Runs `{{test_command}}` in the workspace and diagnoses the failures (draft for human approval).
  With autonomy "approve" you approve the command before it runs.
execution: graph
inputs:
  notes:
    type: text
    label: Notes for this run (optional)
    required: false
    description: e.g. "the CI fails on the login tests since yesterday".
task: "Run the tests of the workspace and diagnose the failures. Notes: {notes}."
orchestrator: {prompt_file: prompts/orchestrator.md}
autonomy: approve
workspace: {path: "{{workspace}}", environment: dev}

start: test_planner

agents:
  test_planner:
    description: Checks how the repository runs its tests (config, folders, setup) before they
      run. Use first.
    prompt_file: prompts/test_planner.md
    tools: [workspace.read, workspace.glob, workspace.grep, workspace.git]
    inputs:
      notes: {from: input.notes, required: false}
    outputs:
      matches_repo: {type: boolean}
      test_folders: {type: text, multiple: true, required: false}
      setup_needed: {type: json, required: false}
      warnings: {type: text, multiple: true, required: false}
  test_runner:
    description: Runs the test command once and records the results. The only agent that runs a
      command.
    prompt_file: prompts/test_runner.md
    tools: [workspace.bash]
    inputs:
      warnings: {from: test_planner.warnings, required: false}
    outputs:
      ran: {type: boolean}
      exit_code: {type: integer, required: false}
      passed: {type: integer, min: 0}
      failed: {type: integer, min: 0}
      errors: {type: integer, min: 0}
      skipped: {type: integer, min: 0, required: false}
      failures: {type: json, required: false, description: "list of {test, file, line, message}"}
      output_tail: {type: text, required: false}
  diagnoser:
    description: Explains each failing test (likely cause with evidence and a proposed fix),
      without changing files.
    prompt_file: prompts/diagnoser.md
    tools: [workspace.read, workspace.grep, workspace.glob, workspace.git]
    inputs:
      ran: {from: test_runner.ran}
      failures: {from: test_runner.failures, required: false}
      output_tail: {from: test_runner.output_tail, required: false}
      setup_needed: {from: test_planner.setup_needed, required: false}
      notes: {from: input.notes, required: false}
    outputs:
      diagnosis: {type: markdown, draft: true}

gates:
  all_passed: {kind: stop, label: All tests passed}
  approve_diagnosis: {kind: human, label: Check the diagnosis of the failures}

edges:
- {from: test_planner, to: test_runner}
- {from: test_runner, to: diagnoser, if: "not test_runner.ran or test_runner.failed > 0 or test_runner.errors > 0"}
- {from: test_runner, to: all_passed, if: "test_runner.ran and test_runner.failed == 0 and test_runner.errors == 0"}
- {from: diagnoser, to: approve_diagnosis}

layout:
  test_planner: {x: 0, y: 0}
  test_runner: {x: 0, y: 200}
  all_passed: {x: 320, y: 420}
  diagnoser: {x: 0, y: 420}
  approve_diagnosis: {x: 0, y: 640}
