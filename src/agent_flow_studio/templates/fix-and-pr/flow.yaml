# Template: fix an issue and open a draft PR. The analyst only reads; the coder writes in the
# workspace (edit/write/bash, following the autonomy); the PR opener writes through the connector.
version: 1
name: fix-and-pr
title: Fix an issue and open a draft PR
description: |
  Issue → plan with evidence → fix on the branch fix/<issue> from {{base_branch}} → tests → push →
  human check → draft PR in {{repository}} through the connector {{connector}}.
input:
  label: Issue number or id
  pattern: "^[A-Za-z0-9_-]{1,40}$"
task: "Fix issue {input} of {{repository}} and propose the fix as a draft pull request."
orchestrator: {prompt_file: prompts/orchestrator.md}
autonomy: approve
workspace: {path: "{{workspace}}", environment: dev}

start: analyst

agents:
  analyst:
    description: Reads the issue through the connector and the code, and writes the fix plan with
      evidence. Use first. Read-only.
    prompt_file: prompts/analyst.md
    tools: [connections.http_get, workspace.read, workspace.grep, workspace.glob, workspace.git,
            artifacts.save_artifact]
    connections: ["{{connector}}"]
    writes:
    - {name: 01_plan.json}
  coder:
    description: Makes the fix on a work branch, adds or updates tests, runs them, commits and
      pushes the branch. Never touches the base branch.
    prompt_file: prompts/coder.md
    tools: [workspace.read, workspace.grep, workspace.glob, workspace.git, workspace.edit,
            workspace.write, workspace.bash, artifacts.read_artifact, artifacts.save_artifact]
    reads: [01_plan.json]
    writes:
    - {name: 02_changes.json}
  pr_opener:
    description: Opens the draft pull request through the connector, after the human check.
    prompt_file: prompts/pr_opener.md
    tools: [connections.http_write, artifacts.read_artifact, artifacts.save_artifact]
    write_connections: ["{{connector}}"]
    reads: [01_plan.json, 02_changes.json]
    writes:
    - {name: 03_pr.json}

gates:
  cannot_fix: {kind: stop, label: The issue cannot be fixed as it is (see the plan)}
  approve_pr: {kind: human, label: Check the changes on the branch before the PR is opened}
  pr_opened: {kind: stop, label: Draft pull request opened}

edges:
- {from: analyst, to: coder, when: the plan is saved and the fix is clear}
- {from: analyst, to: cannot_fix, when: "the issue was not found, is unclear or is not a code change"}
- {from: coder, to: approve_pr, when: the branch is pushed and the tests ran}
- {from: approve_pr, to: pr_opener, when: approved}
- {from: pr_opener, to: pr_opened, when: the pull request is open}

layout:
  analyst: {x: 0, y: 0}
  cannot_fix: {x: 300, y: 160}
  coder: {x: 0, y: 160}
  approve_pr: {x: 0, y: 320}
  pr_opener: {x: 0, y: 480}
  pr_opened: {x: 0, y: 640}
