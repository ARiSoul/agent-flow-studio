version: 1
name: pipeline
title: Example pipeline (tests)
task: Process request {input} following the flow.
orchestrator:
  prompt_file: prompts/orchestrator.md
start: triage
agents:
  triage:
    description: Reads the request and extracts the main facts. Use first.
    prompt_file: prompts/triage.md
    tools:
    - artifacts.save_artifact
    writes:
    - name: 01_triage.json
  identity:
    description: Confirms that the subject of the request exists.
    prompt_file: prompts/identity.md
    tools:
    - artifacts.read_artifact
    - artifacts.save_artifact
    writes:
    - name: 02_identity.json
    reads:
    - 01_triage.json
  current_state:
    description: Collects the current state and compares it with the request.
    prompt_file: prompts/current_state.md
    tools:
    - artifacts.read_artifact
    - artifacts.save_artifact
    writes:
    - name: 03_current_state.json
    reads:
    - 01_triage.json
    - 02_identity.json
  log_investigator:
    description: Rebuilds the timeline from the logs.
    prompt_file: prompts/log_investigator.md
    tools:
    - artifacts.read_artifact
    - artifacts.save_artifact
    writes:
    - name: 04_log_investigator.json
    reads:
    - 01_triage.json
    - 02_identity.json
    - 03_current_state.json
  cross_checker:
    description: Cross-checks the sources to find inconsistencies.
    prompt_file: prompts/cross_checker.md
    tools:
    - artifacts.read_artifact
    - artifacts.save_artifact
    writes:
    - name: 05_cross_checker.json
    reads:
    - 01_triage.json
    - 02_identity.json
    - 03_current_state.json
    - 04_log_investigator.json
  diagnostician:
    description: Classifies the likely cause, the confidence and the next step.
    prompt_file: prompts/diagnostician.md
    tools:
    - artifacts.read_artifact
    - artifacts.save_artifact
    writes:
    - name: 06_diagnostician.json
    reads:
    - 01_triage.json
    - 02_identity.json
    - 03_current_state.json
    - 04_log_investigator.json
    - 05_cross_checker.json
  responder:
    description: Prepares the reply drafts for approval.
    prompt_file: prompts/responder.md
    tools:
    - artifacts.read_artifact
    - artifacts.save_artifact
    writes:
    - name: 07_reply.md
      draft: true
    - name: 07_note.md
      draft: true
    reads:
    - 01_triage.json
    - 02_identity.json
    - 03_current_state.json
    - 04_log_investigator.json
    - 05_cross_checker.json
    - 06_diagnostician.json
gates:
  analyst_answers:
    kind: human
    label: Analyst answers the questions
  user_not_found:
    kind: stop
    label: Subject not found
  approve_fix:
    kind: human
    label: Approve fix
  approve_export:
    kind: human
    label: Approve export request
  approve_dev_ticket:
    kind: human
    label: Approve development request
  approve_reply:
    kind: human
    label: Approve reply
edges:
- from: triage
  to: analyst_answers
  when: data is missing
- from: triage
  to: identity
  when: the triage is complete
- from: analyst_answers
  to: triage
  when: the analyst answered
- from: identity
  to: user_not_found
  when: it does not exist
- from: identity
  to: current_state
  when: it exists
- from: current_state
  to: log_investigator
  when: there are differences
- from: current_state
  to: responder
  when: everything is as expected
- from: log_investigator
  to: cross_checker
- from: cross_checker
  to: diagnostician
- from: diagnostician
  to: responder
- from: responder
  to: approve_fix
  when: next step = fix
- from: responder
  to: approve_export
  when: next step = export
- from: responder
  to: approve_dev_ticket
  when: next step = dev
- from: responder
  to: approve_reply
  when: next step = reply
