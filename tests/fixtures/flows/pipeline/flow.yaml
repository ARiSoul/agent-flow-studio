version: 1
name: pipeline
title: Pipeline de exemplo (testes)
task: Processa o pedido {input} seguindo o fluxo.
orchestrator:
  prompt_file: prompts/orchestrator.md
start: triage
agents:
  triage:
    description: Lê o pedido e extrai os factos principais. Usar primeiro.
    prompt_file: prompts/triage.md
    tools:
    - artifacts.save_artifact
    writes:
    - name: 01_triage.json
  identity:
    description: Confirma que o sujeito do pedido existe.
    prompt_file: prompts/identity.md
    tools:
    - artifacts.read_artifact
    - artifacts.save_artifact
    writes:
    - name: 02_identity.json
    reads:
    - 01_triage.json
  current_state:
    description: Recolhe o estado atual e compara com o pedido.
    prompt_file: prompts/current_state.md
    tools:
    - artifacts.read_artifact
    - artifacts.save_artifact
    writes:
    - name: 03_current_state.json
    reads:
    - 01_triage.json
    - 02_identity.json
  log_investigator:
    description: Reconstrói a linha temporal a partir dos registos.
    prompt_file: prompts/log_investigator.md
    tools:
    - artifacts.read_artifact
    - artifacts.save_artifact
    writes:
    - name: 04_log_investigator.json
    reads:
    - 01_triage.json
    - 02_identity.json
    - 03_current_state.json
  cross_checker:
    description: Confronta as fontes para detetar inconsistências.
    prompt_file: prompts/cross_checker.md
    tools:
    - artifacts.read_artifact
    - artifacts.save_artifact
    writes:
    - name: 05_cross_checker.json
    reads:
    - 01_triage.json
    - 02_identity.json
    - 03_current_state.json
    - 04_log_investigator.json
  diagnostician:
    description: Classifica a causa provável, a confiança e o próximo passo.
    prompt_file: prompts/diagnostician.md
    tools:
    - artifacts.read_artifact
    - artifacts.save_artifact
    writes:
    - name: 06_diagnostician.json
    reads:
    - 01_triage.json
    - 02_identity.json
    - 03_current_state.json
    - 04_log_investigator.json
    - 05_cross_checker.json
  responder:
    description: Prepara os rascunhos de resposta para aprovação.
    prompt_file: prompts/responder.md
    tools:
    - artifacts.read_artifact
    - artifacts.save_artifact
    writes:
    - name: 07_reply.md
      draft: true
    - name: 07_note.md
      draft: true
    reads:
    - 01_triage.json
    - 02_identity.json
    - 03_current_state.json
    - 04_log_investigator.json
    - 05_cross_checker.json
    - 06_diagnostician.json
gates:
  analyst_answers:
    kind: human
    label: Analista responde às perguntas
  user_not_found:
    kind: stop
    label: Sujeito não encontrado
  approve_fix:
    kind: human
    label: Aprovar correção
  approve_export:
    kind: human
    label: Aprovar pedido de exportação
  approve_dev_ticket:
    kind: human
    label: Aprovar pedido de desenvolvimento
  approve_reply:
    kind: human
    label: Aprovar resposta
edges:
- from: triage
  to: analyst_answers
  when: faltam dados
- from: triage
  to: identity
  when: a triagem está completa
- from: analyst_answers
  to: triage
  when: o analista respondeu
- from: identity
  to: user_not_found
  when: não existe
- from: identity
  to: current_state
  when: existe
- from: current_state
  to: log_investigator
  when: há diferenças
- from: current_state
  to: responder
  when: está tudo como esperado
- from: log_investigator
  to: cross_checker
- from: cross_checker
  to: diagnostician
- from: diagnostician
  to: responder
- from: responder
  to: approve_fix
  when: próximo passo = fix
- from: responder
  to: approve_export
  when: próximo passo = export
- from: responder
  to: approve_dev_ticket
  when: próximo passo = dev
- from: responder
  to: approve_reply
  when: próximo passo = reply
