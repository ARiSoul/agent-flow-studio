[project]
name = "agent-flow-studio"
version = "0.1.0"
description = "Studio to build, test and run agent flows (Claude Agent SDK): visual editor, assistant, connectors and writes with controlled autonomy."
requires-python = ">=3.10"
dependencies = [
  "claude-agent-sdk",
  "pydantic>=2",
  "pyyaml>=6",
  "httpx>=0.27",
  "keyring>=25",
  "mcp>=2",  # the studio as an MCP server for Claude Code (also a dependency of the SDK)
]

[project.optional-dependencies]
editor = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest", "ruff", "httpx", "fastapi>=0.110", "uvicorn>=0.29"]
# website connectors (a real browser with your sign-in; uses the installed Edge/Chrome)
web = ["playwright>=1.45"]
# video frames and large images for the agents, when ffmpeg is not on PATH
media = ["imageio-ffmpeg>=0.5"]

[project.scripts]
agent-flow-studio = "agent_flow_studio.main:main"
agent-flow-studio-flows = "agent_flow_studio.flows_cli:main"
agent-flow-studio-editor = "agent_flow_studio.editor.server:main"
agent-flow-studio-mcp = "agent_flow_studio.studio_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_flow_studio"]
artifacts = ["src/agent_flow_studio/editor/static/**"]

[tool.pytest.ini_options]
pythonpath = ["src", "extensions"]
testpaths = ["tests", "extensions/*/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
extend-exclude = ["editor/node_modules"]
